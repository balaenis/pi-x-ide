[tools]
node = "26"
bun = "1.3.14"

[tasks.setup]
description = "Install project dependencies"
run = "bun install --frozen-lockfile"

[tasks.typecheck]
description = "Type-check TypeScript and IDE extension"
depends = ["setup"]
run = "bun run typecheck"

[tasks.test]
description = "Build and run unit tests"
depends = ["setup"]
run = "bun run test"

[tasks."generate:config-schema"]
description = "Generate schemas/config.json from the config registry"
run = "bun run generate:config-schema"

[tasks."check:config-schema"]
description = "Check schemas/config.json is in sync with the config registry"
run = "bun run check:config-schema"

[tasks.lint]
description = "Lint the project"
depends = ["setup"]
run = "bun run lint"

[tasks."lint:fix"]
description = "Lint and auto-fix the project"
run = "bun run lint:fix"

[tasks.format]
description = "Format the project with prettier"
run = "bun run format"

[tasks."format:check"]
description = "Check formatting with prettier"
run = "bun run format:check"

[tasks."compile:vsix"]
description = "Build the VS Code extension for local debugging"
depends = ["setup"]
run = "bun run compile:vsix"

[tasks."package:vsix"]
description = "Build the production VS Code VSIX package"
depends = ["setup"]
run = "bun run package:vsix"

[tasks."package:nvim-sidecar"]
description = "Build the nvim sidecar binary"
depends = ["setup"]
run = "bun run package:nvim-sidecar"

[tasks."package:nvim-sidecar:all"]
description = "Build all nvim sidecar binaries"
depends = ["setup"]
run = "bun run package:nvim-sidecar:all"

[tasks.build]
description = "Build the pi extension package (TypeScript + IDE extension)"
depends = ["setup"]
run = "bun run build"

[tasks."build:all"]
description = "Full build including all platform ide extension binaries"
depends = ["setup"]
run = "bun run build:all"

[tasks.publish]
description = "Publish the pi extension package to npm"
depends = ["setup"]
run = 'bun run compile && bun publish --access public --tag "${NPM_TAG:-latest}"'
