name: Auto Format

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-fork:
    name: Check fork formatting
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Tooling
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          experimental: true

      - name: Check formatting
        run: mise run format:check

  format-same-repo:
    name: Apply formatting
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if last commit is auto-format
        id: check-commit
        run: |
          MSG=$(git log -1 --format=%s)
          if echo "$MSG" | grep -q "^style: apply prettier"; then
            echo "already-formatted=true" >> "$GITHUB_OUTPUT"
            echo "Last commit is already an auto-format commit. Skipping."
          else
            echo "already-formatted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Tooling
        if: steps.check-commit.outputs.already-formatted != 'true'
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          experimental: true

      - name: Run Prettier
        if: steps.check-commit.outputs.already-formatted != 'true'
        run: mise run format

      - name: Commit formatting changes
        if: steps.check-commit.outputs.already-formatted != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: apply prettier formatting"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
