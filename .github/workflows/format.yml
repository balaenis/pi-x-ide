name: Auto Format

on:
  pull_request:
    types: [opened, synchronize]
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if last commit is auto-format
        id: check-commit
        run: |
          MSG=$(git log -1 --format=%s)
          if echo "$MSG" | grep -q "^style: apply prettier"; then
            echo "already-formatted=true" >> "$GITHUB_OUTPUT"
            echo "Last commit is already an auto-format commit. Skipping."
          else
            echo "already-formatted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Tooling
        if: steps.check-commit.outputs.already-formatted != 'true'
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          experimental: true

      - name: Run Prettier
        if: steps.check-commit.outputs.already-formatted != 'true'
        run: bun run format

      - name: Commit formatting changes
        if: steps.check-commit.outputs.already-formatted != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply prettier formatting"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
