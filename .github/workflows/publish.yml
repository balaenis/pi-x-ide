name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm tag (latest or next)"
        required: true
        type: choice
        options:
          - latest
          - next
  repository_dispatch:
    types: [publish-package]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          experimental: true

      - name: Publish to npm
        env:
          TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag || 'latest' }}
        run: |
          echo "Publishing with tag: $TAG"
          NPM_TAG="$TAG" mise run publish
