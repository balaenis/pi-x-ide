name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  process:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      prs_created: ${{ steps.release-please.outputs.prs_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: false

  dispatch-publish:
    needs: process
    runs-on: ubuntu-latest
    if: needs.process.outputs.releases_created == 'true'
    steps:
      - name: Dispatch publish for releases
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-package
          client-payload: '{"tag": "latest"}'

  build-vsix:
    needs: process
    runs-on: ubuntu-latest
    if: needs.process.outputs.releases_created == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.process.outputs.tag_name }}

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          experimental: true

      - name: Verify VS Code extension version
        env:
          TAG_NAME: ${{ needs.process.outputs.tag_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          VSCODE_VERSION="$(node -p "require('./vscode/package.json').version")"

          if [ "$ROOT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Root package version ($ROOT_VERSION) does not match release tag ($TAG_NAME)."
            exit 1
          fi

          if [ "$VSCODE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VS Code extension version ($VSCODE_VERSION) does not match release tag ($TAG_NAME)."
            exit 1
          fi

      - name: Install dependencies
        run: mise run setup

      - name: Build VSIX
        run: mise run vscode:package

      - name: Upload VSIX to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.process.outputs.tag_name }}
          files: vscode/dist/*.vsix

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to VS Code Marketplace
        run: |
          VSIX_FILE=$(ls vscode/dist/*.vsix | head -1)
          echo "Publishing $VSIX_FILE to VS Code Marketplace..."
          npx @vscode/vsce publish --azure-credential --packagePath "$VSIX_FILE"

  build-sidecar-binaries:
    needs: process
    runs-on: ubuntu-latest
    if: needs.process.outputs.releases_created == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.process.outputs.tag_name }}

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          experimental: true

      - name: Install dependencies
        run: mise run setup

      - name: Build TypeScript
        run: mise run build

      - name: Build all sidecar platform binaries
        run: mise run build:sidecar:all

      - name: Upload sidecar binaries to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.process.outputs.tag_name }}
          files: |
            nvim/bin/pi-x-ide-nvim-sidecar-linux-x64
            nvim/bin/pi-x-ide-nvim-sidecar-linux-arm64
            nvim/bin/pi-x-ide-nvim-sidecar-darwin-x64
            nvim/bin/pi-x-ide-nvim-sidecar-darwin-arm64
            nvim/bin/pi-x-ide-nvim-sidecar-windows-x64.exe
