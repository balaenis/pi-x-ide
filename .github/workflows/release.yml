name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  process:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      prs_created: ${{ steps.release-please.outputs.prs_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: false

  dispatch-publish:
    needs: process
    runs-on: ubuntu-latest
    if: needs.process.outputs.releases_created == 'true'
    steps:
      - name: Dispatch publish for releases
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-package
          client-payload: '{"tag": "latest"}'

  build-vsix:
    needs: process
    runs-on: ubuntu-latest
    if: needs.process.outputs.releases_created == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.process.outputs.tag_name }}

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          experimental: true

      - name: Verify VS Code extension version
        env:
          TAG_NAME: ${{ needs.process.outputs.tag_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          VSCODE_VERSION="$(node -p "require('./ide-plugins/vscode/package.json').version")"

          if [ "$ROOT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Root package version ($ROOT_VERSION) does not match release tag ($TAG_NAME)."
            exit 1
          fi

          if [ "$VSCODE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VS Code extension version ($VSCODE_VERSION) does not match release tag ($TAG_NAME)."
            exit 1
          fi

      - name: Build VSIX
        run: mise run package:vsix

      - name: Upload VSIX to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.process.outputs.tag_name }}
          files: ide-plugins/vscode/dist/*.vsix

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to VS Code Marketplace
        run: |
          VSIX_FILE=$(ls ide-plugins/vscode/dist/*.vsix | head -1)
          echo "Publishing $VSIX_FILE to VS Code Marketplace..."
          npx @vscode/vsce publish --azure-credential --packagePath "$VSIX_FILE"

  build-sidecar-binaries:
    needs: process
    runs-on: ubuntu-latest
    if: needs.process.outputs.releases_created == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.process.outputs.tag_name }}

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          experimental: true

      - name: Build with all sidecar platform binaries
        run: mise run package:nvim-sidecar:all

      - name: Upload sidecar binaries to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.process.outputs.tag_name }}
          files: |
            ide-plugins/nvim/bin/pi-x-ide-nvim-sidecar-linux-x64
            ide-plugins/nvim/bin/pi-x-ide-nvim-sidecar-linux-arm64
            ide-plugins/nvim/bin/pi-x-ide-nvim-sidecar-darwin-x64
            ide-plugins/nvim/bin/pi-x-ide-nvim-sidecar-darwin-arm64
            ide-plugins/nvim/bin/pi-x-ide-nvim-sidecar-windows-x64.exe

  build-jetbrains-plugin:
    needs: process
    runs-on: ubuntu-latest
    if: needs.process.outputs.releases_created == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.process.outputs.tag_name }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          experimental: true

      - name: Verify JetBrains plugin version
        env:
          TAG_NAME: ${{ needs.process.outputs.tag_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          JETBRAINS_VERSION="$(sed -n 's/^pluginVersion=\([^ ]*\).*/\1/p' ide-plugins/jetbrains/gradle.properties)"

          if [ "$JETBRAINS_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::JetBrains plugin version ($JETBRAINS_VERSION) does not match release tag ($TAG_NAME)."
            exit 1
          fi

      - name: Build JetBrains plugin ZIP
        env:
          # Signing secrets are optional: when absent, `signPlugin` is skipped and an unsigned
          # archive is produced. When present, the uploaded Release zip is already signed.
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: mise run package:jetbrains

      - name: Upload JetBrains plugin to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.process.outputs.tag_name }}
          files: ide-plugins/jetbrains/build/distributions/*.zip

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ] || [ -z "$PRIVATE_KEY" ] || [ -z "$CERTIFICATE_CHAIN" ]; then
            echo "::notice::Marketplace publish secrets not fully configured — skipping publish. GitHub Release upload completed."
            exit 0
          fi

          cd ide-plugins/jetbrains && ./gradlew publishPlugin
